[project]
name = "autonomous-validator"
version = "0.1.0"
description = "LLM-first autonomous governance & validation agent"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "pandas>=2.1.0",
  "pyarrow>=15.0.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
